[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-harness"
version = "1.1.3"
description = "Isolated Python with LangChain, LangGraph and Deep Agents"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "deepagents>=0.3,<1",
  "langchain-openai>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]<3,>=2.0",
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "filelock>=3.18,<4",
  "tomlkit>=0.13,<1",
  "langchain-core<2,>=1.7",
  "langsmith<0.16,>=0.14",
  "packaging<27,>=26",
  "langchain-ollama<2,>=1.0",
  "mcp<3,>=2.0",
  "jsonschema<5,>=4.20",
  "trafilatura<3,>=2",
  "ddgs<10,>=9",
  "PyYAML<7,>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
deep-harness = "deep_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deep_harness = [
  "server.yaml",
  "infrastructure/web/pi_dist/search.cjs",
  "infrastructure/web/pi_dist/LICENSES.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["deep_harness"]
