[model]
provider = "ollama"
name = "qwen3.5:9b"
base_url = "http://127.0.0.1:11434"
request_timeout_seconds = 180
context_window_tokens = 32768
# qwen3.5 是 thinking 模型。开启 reasoning 时回答会写入 Ollama 的 thinking
# 字段，LangChain 适配器读不到，结果是「执行完成但没有文本」。保持 false；
# 只有在你能自行处理 thinking 输出时才设为 true。
reasoning = false

# 联网检索：搜索后端按 routing 顺序回退，首个返回非空结果的后端生效。
# API key 只写环境变量名，实际密钥从进程环境读取，不进入会话快照。
# 零配置时优先 bing_cn（免密钥、国内可直连）；ddgs / jina 作为后续兜底，
# 但二者依赖境外域名，在国内网络可能读超时。自建 SearXNG 填 searxng_url 即可。
[web]
enabled = true
routing = ["tavily", "exa", "brave", "serper", "searxng", "bing_cn", "ddgs", "jina"]
extract_routing = ["static"]
request_timeout_seconds = 15
total_timeout_seconds = 30
max_cache_entries = 128
max_response_chars = 8000
max_sources = 6
max_queries = 4
max_concurrency = 4
cache_ttl_seconds = 300
allow_private_urls = false
# 自建服务示例（去掉注释即可启用）：
# searxng_url = "http://127.0.0.1:8888"
# firecrawl_url = "http://127.0.0.1:3002"
